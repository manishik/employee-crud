name: employee-crud

services:
  api:
    build: ./employee-api-crud
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s

  ui:
    build: ./employee-ui-react
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
